<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniTracker | Search</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- navigation bar -->
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">AniTracker</a>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="search.html">Search</a></li>
        <li class="nav-item"><a class="nav-link" href="mylist.html">My List</a></li>
      </ul>
    </div>
  </nav>

  <main class="container my-4">
    <h1>Search Anime</h1>
    <p class="text-muted">Find any anime and add it to your list.</p>

    <!-- search form -->
    <form id="search-form" class="d-flex mb-4">
      <input type="text" id="search-input" class="form-control me-2" placeholder="e.g. Naruto" required>
      <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <!-- search results will be added here by JavaScript -->
    <div id="search-results" class="row"></div>
  </main>

  <script src="Javascript/search.js"></script>
</body>
</html>
